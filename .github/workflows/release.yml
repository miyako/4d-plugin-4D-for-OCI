name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          submodules: recursive

      - name: Download Oracle Instant Client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download oracle-libs `
            --pattern 'oracle-instantclient-windows-x64.tar.gz' `
            --dir $env:TEMP
          New-Item -ItemType Directory -Force -Path oracle\windows-x64
          tar xzf "$env:TEMP\oracle-instantclient-windows-x64.tar.gz" `
            -C oracle\windows-x64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          cmake -B 4D-for-OCI/cmake-build `
            -S 4D-for-OCI `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build 4D-for-OCI/cmake-build --config Release

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            4D-for-OCI/cmake-build/Plugins/4D-for-OCI/Contents/Windows64/4D-for-OCI.4DX
            4D-for-OCI/cmake-build/Plugins/4D-for-OCI/Contents/Windows64/*.dll
            4D-for-OCI/cmake-build/Plugins/4D-for-OCI/Contents/Resources/
          if-no-files-found: error

  build-macos:
    name: Build macOS, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          submodules: recursive

      - name: Download Oracle Instant Client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download oracle-libs \
            --pattern 'oracle-instantclient-macos-aarm64.tar.gz' \
            --dir /tmp
          mkdir -p oracle/macos-aarm64
          tar xzf /tmp/oracle-instantclient-macos-aarm64.tar.gz \
            -C oracle/macos-aarm64

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Configure
        run: |
          cmake -B 4D-for-OCI/cmake-build \
            -S 4D-for-OCI \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build 4D-for-OCI/cmake-build --config Release

      - name: Merge Windows binaries into bundle
        run: |
          set -euo pipefail
          BUNDLE="4D-for-OCI/4D-for-OCI-test/Plugins/4D-for-OCI.bundle"
          mkdir -p "$BUNDLE/Contents/Windows64"
          cp winbuild/*.4DX "$BUNDLE/Contents/Windows64/" || true
          cp winbuild/*.dll "$BUNDLE/Contents/Windows64/" || true
          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"

      - name: Codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"

      - name: Package, notarize & staple
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="4D-for-OCI-${VERSION}.zip"
          DMG_PATH="4D-for-OCI-${VERSION}.dmg"

          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          hdiutil create -format UDBZ -volname "4D-for-OCI" \
            -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --keychain-profile "notarytool-profile" \
            --keychain "$KEYCHAIN_PATH" --wait
          xcrun notarytool submit "$DMG_PATH" \
            --keychain-profile "notarytool-profile" \
            --keychain "$KEYCHAIN_PATH" --wait
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
